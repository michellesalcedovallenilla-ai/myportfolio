  <body>

    <!-- React entry -->

    <!-- cursor controlado por el mouse pixel-art de la escena (postMessage) -->
    <script>
      (function () {
        var SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">'
          + '<polygon points="3,1 3,20.5 7.8,16.2 10.6,23 13.4,21.7 10.6,15 17.5,15" '
          + 'fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></svg>';
        var cur = document.createElement('div');
        cur.style.cssText = 'position:fixed;left:0;top:0;z-index:2147483647;pointer-events:none;'
          + 'display:none;width:26px;height:26px;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.45));';
        cur.innerHTML = SVG;
        document.body.appendChild(cur);
        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d || d.type !== 'xp-cursor') return;
          if (d.hide) { cur.style.display = 'none'; return; }
          cur.style.display = 'block';
          cur.style.left = (d.x * window.innerWidth - 3) + 'px';
          cur.style.top = (d.y * window.innerHeight - 1) + 'px';
        });
      })();
    </script>
  </body>

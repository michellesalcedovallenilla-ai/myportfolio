<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no">
<meta name="HandheldFriendly" content="true">
<title>Michelle Salcedo</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script src="../i18n.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
:root{--bg:#8bac0f;--fg:#0f380f;--mid:#306230;--lt:#9bbc0f;--dk:#061a06;--scan-line:rgba(0,0,0,.05);--screen-sheen:rgba(255,255,255,.08);--screen-glow:rgba(155,188,15,.16);}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-ms-content-zooming:none;}
html,body{height:100%;background:#0a0a0a;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'VT323','Courier New',monospace;touch-action:manipulation;-ms-content-zooming:none;}
#phone{position:relative;height:96vh;width:auto;flex-shrink:0;user-select:none;touch-action:manipulation;}
#phone-img{height:100%;width:auto;display:block;pointer-events:none;}
#screen{position:absolute;top:1%;left:3%;width:94%;height:52.5%;background:var(--bg);overflow:hidden;border-radius:1.2%;display:flex;flex-direction:column;--fs:calc(96vh * 0.46 / 20);font-size:var(--fs);color:var(--fg);image-rendering:pixelated;box-shadow:inset 0 0 0 .08em rgba(0,0,0,.16),inset 0 0 2.4em var(--screen-glow);}
#screen::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:99;background:linear-gradient(180deg,var(--screen-sheen),rgba(255,255,255,0) 22%,rgba(255,255,255,0) 78%,rgba(0,0,0,.12) 100%);border-radius:inherit;}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(to bottom,transparent 0,transparent 1px,var(--scan-line) 1px,var(--scan-line) 2px);border-radius:inherit;}
/* STATUS BAR */
#sb{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:.1em .3em;background:var(--bg);border-bottom:.1em solid var(--mid);font-size:.66em;letter-spacing:.03em;}
.sig{display:flex;align-items:flex-end;gap:.06em;}.sig span{display:inline-block;background:var(--fg);width:.2em;}
.sig span:nth-child(1){height:.3em}.sig span:nth-child(2){height:.5em}.sig span:nth-child(3){height:.7em}.sig span:nth-child(4){height:.9em}.sig span:nth-child(5){height:1.1em}
.bat-b{width:1.3em;height:.65em;border:.1em solid var(--fg);display:flex;align-items:center;padding:.06em;position:relative;}
.bat-b::after{content:'';position:absolute;right:-.18em;top:50%;transform:translateY(-50%);width:.1em;height:.28em;background:var(--fg);}
.bat-f{height:100%;background:var(--fg);transition:width .5s;}
#sb-l,#sb-r{display:flex;align-items:center;gap:.25em;}
/* APP */
#app{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;}
/* COMMON */
.atitle{flex-shrink:0;background:var(--fg);color:var(--bg);padding:.1em .3em;font-size:.85em;letter-spacing:.07em;display:flex;justify-content:space-between;}
.atitle .back-btn{cursor:pointer;opacity:.75;font-size:.78em;padding:.05em .3em;border-left:.1em solid rgba(255,255,255,.25);}
.atitle .back-btn:active{opacity:1;background:rgba(255,255,255,.2);}
.abody{flex:1;overflow-y:auto;padding:.28em .32em;scrollbar-width:none;}
.abody::-webkit-scrollbar{display:none;}
.sk{flex-shrink:0;display:flex;justify-content:space-between;font-size:.62em;padding:.08em .3em;border-top:.1em solid var(--mid);color:var(--mid);letter-spacing:.04em;}
p{font-size:.8em;line-height:1.3;margin-bottom:.2em;}
/* IDLE */
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.2em .3em;}
.idle-op{font-size:.65em;color:var(--mid);letter-spacing:.08em;}
.idle-date{font-size:.7em;color:var(--mid);}
.idle-time{font-size:2.3em;letter-spacing:.06em;line-height:1;}
.idle-dial{font-size:1.1em;letter-spacing:.12em;background:var(--fg);color:var(--bg);padding:.04em .3em;margin:.1em 0;}
.idle-sk{width:100%;display:flex;justify-content:space-between;font-size:.62em;color:var(--mid);}
/* BOOT / SIM */
.cscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;}
.boot-logo{font-size:2.2em;letter-spacing:.15em;animation:pulse .7s ease-in-out 4;}
.boot-bar{width:65%;height:.4em;border:.1em solid var(--fg);margin-top:.3em;}
.boot-fill{height:100%;background:var(--fg);animation:bootfill 1.4s ease-in forwards;}
/* MENU */
/* ── MENU (Nokia reference style) ── */
.mmenu{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.mcat{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:.1em .35em;background:var(--fg);color:var(--bg);font-size:.78em;letter-spacing:.12em;}
.mcat-arrow{font-size:1.15em;cursor:pointer;padding:0 .2em;opacity:.75;}.mcat-arrow:active{opacity:1;}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:.06em;padding:.06em;overflow:hidden;}
.mitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.06em;cursor:pointer;background:var(--lt);}
.mitem .mi{font-size:2em;line-height:1;width:1.1em;height:1.1em;display:flex;align-items:center;justify-content:center;}
.mitem .mi svg{width:100%;height:100%;display:block;fill:currentColor;shape-rendering:crispEdges;}
.mitem .ml{font-size:.52em;letter-spacing:.02em;text-align:center;line-height:1.1;white-space:nowrap;}
.mitem.s{background:var(--fg);color:var(--bg);}
.mitem:active:not(.s){background:var(--mid);color:var(--bg);}
.mcta{flex-shrink:0;text-align:center;font-size:.42em;color:var(--bg);background:var(--fg);padding:.28em .4em;letter-spacing:.06em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:mctascroll 12s linear infinite;}
@keyframes mctascroll{0%{letter-spacing:.06em}50%{letter-spacing:.10em}100%{letter-spacing:.06em}}
/* CALLING */
.calling{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;}
.call-ic{font-size:2.2em;animation:ringpulse .5s ease-in-out infinite;}
.call-nm{font-size:1em;letter-spacing:.05em;}
.call-nu{font-size:.75em;color:var(--mid);}
.call-st{font-size:.78em;color:var(--mid);letter-spacing:.06em;}
.call-tm{font-size:.85em;letter-spacing:.1em;}
/* LIST ITEMS */
.li{display:flex;align-items:center;justify-content:space-between;padding:.18em .1em;font-size:.8em;border-bottom:.08em solid var(--mid);cursor:pointer;}
.li.s{background:var(--fg);color:var(--bg);}
.li-sub{font-size:.7em;color:var(--mid);}
.li.s .li-sub{color:var(--bg);opacity:.75;}
/* CALCULATOR */
.calc-d{background:var(--lt);border:.12em solid var(--fg);padding:.18em .35em;font-size:1.5em;text-align:right;margin-bottom:.2em;min-height:1.6em;word-break:break-all;}
.calc-op{font-size:.72em;color:var(--mid);text-align:right;margin-bottom:.15em;}
/* ALARM / STOPWATCH */
.bigtime{font-size:2em;text-align:center;letter-spacing:.1em;margin:.35em 0;}
.bigtime .sel-field{background:var(--fg);color:var(--bg);}
/* CALENDAR */
.cal-hd{text-align:center;font-size:.85em;padding:.15em;letter-spacing:.05em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.04em;font-size:.7em;text-align:center;}
.cal-dn{color:var(--mid);padding:.06em;}
.cal-c{padding:.06em;cursor:pointer;}
.cal-c.today{background:var(--fg);color:var(--bg);}
.cal-c.om{opacity:.35;}
/* SETTINGS */
.srow{display:flex;justify-content:space-between;align-items:center;padding:.18em .1em;font-size:.8em;border-bottom:.08em solid var(--mid);cursor:pointer;}
.srow.s{background:var(--fg);color:var(--bg);}
.sval{font-size:.72em;color:var(--mid);}
.srow.s .sval{color:var(--bg);opacity:.8;}
/* CALL TO ACTION */
.fbtn{display:block;width:100%;background:var(--fg);color:var(--bg);border:none;font-family:'VT323','Courier New',monospace;font-size:.8em;padding:.2em;cursor:pointer;letter-spacing:.06em;}
/* LINKS */
.lrow{display:flex;gap:.2em;align-items:center;padding:.15em 0;font-size:.78em;border-bottom:.08em solid var(--mid);cursor:pointer;}
.lrow.s{background:var(--fg);color:var(--bg);padding-left:.2em;}
.lrow a{color:var(--fg);text-decoration:none;border-bottom:.07em solid var(--mid);}
.lrow.s a{color:var(--bg);border:none;}
/* SNAKE */
#snk-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.snk-hd{flex-shrink:0;display:flex;justify-content:space-between;padding:.08em .3em;font-size:.7em;border-bottom:.1em solid var(--mid);}
#snk-cvs{flex:1;display:block;image-rendering:pixelated;background:var(--bg);}
/* CAMERA */
#cam-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cam-vf{flex:1;position:relative;overflow:hidden;}
#cam-cvs{width:100%;height:100%;display:block;image-rendering:pixelated;}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s;}
.cam-flash.on{opacity:1;}
.cam-ctrl{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:.1em .28em;border-top:.1em solid var(--mid);font-size:.68em;}
.cam-fb{border:.08em solid var(--mid);padding:.05em .22em;cursor:pointer;}
.cam-fb.on{background:var(--fg);color:var(--bg);}
/* GALLERY */
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:.14em;padding:.2em;}
.gal-th{border:.1em solid var(--mid);height:3.2em;display:flex;align-items:center;justify-content:center;font-size:.68em;cursor:pointer;background:var(--lt);text-align:center;}
.gal-th.s{border-color:var(--fg);outline:.12em solid var(--fg);}
/* RINGTONE */
.rt-staff{display:flex;gap:.15em;flex-wrap:wrap;padding:.15em;border:.1em solid var(--mid);min-height:1.8em;background:var(--lt);font-size:.72em;margin-bottom:.15em;}
.rt-n{padding:.04em .18em;border:.07em solid var(--fg);}.rt-n.pl{background:var(--fg);color:var(--bg);}
/* WORLD CLOCK */
.wc-row{display:flex;justify-content:space-between;align-items:center;padding:.18em .1em;border-bottom:.08em solid var(--mid);font-size:.8em;}
.wc-city{font-size:.72em;color:var(--mid);}
/* LOCK */
.lock-pin{font-size:1.8em;letter-spacing:.5em;text-align:center;margin:.3em 0;}
.lock-hint{font-size:.7em;color:var(--mid);text-align:center;}
/* MSG POPUP */
.mpop{position:absolute;bottom:.3em;left:.2em;right:.2em;background:var(--fg);color:var(--bg);padding:.2em .3em;font-size:.75em;border-radius:2px;z-index:200;animation:slideup .25s ease-out;}
/* ANIMATIONS */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes bootfill{from{width:0}to{width:100%}}
@keyframes ringpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes slideup{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes chargepulse{0%,100%{opacity:1}50%{opacity:.5}}
.blink{display:inline-block;width:.4em;height:.85em;background:var(--fg);vertical-align:middle;animation:blink 1s step-end infinite;margin-left:.08em;}
/* RADIO */
.radio-wrap{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:.22em .3em .15em;gap:.18em;}
.radio-head{display:flex;justify-content:space-between;align-items:center;font-size:.56em;color:var(--mid);letter-spacing:.08em;}
.radio-window{border:.08em solid var(--fg);background:linear-gradient(180deg,var(--lt),var(--bg));padding:.24em .26em .2em;display:flex;flex-direction:column;gap:.14em;box-shadow:inset 0 0 0 .08em rgba(0,0,0,.08);}
.radio-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:.2em;}
.radio-freq{font-size:2.05em;letter-spacing:.05em;line-height:1;}
.radio-name{font-size:.72em;color:var(--fg);letter-spacing:.08em;margin:.02em 0;}
.radio-genre{font-size:.58em;color:var(--mid);letter-spacing:.08em;text-transform:uppercase;}
.radio-scale{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:.08em;padding-bottom:.95em;margin:.02em 0 .06em;}
.radio-scale span{height:.28em;border-top:.08em solid var(--mid);opacity:.75;position:relative;}
.radio-scale span::after{content:attr(data-l);position:absolute;top:.34em;left:50%;transform:translateX(-50%);font-size:.45em;color:var(--mid);}
.radio-needle{position:absolute;top:-.08em;bottom:.82em;width:.1em;background:var(--fg);left:var(--needle-left,50%);}
.radio-needle::after{content:'';position:absolute;bottom:-.22em;left:50%;transform:translateX(-50%);width:.48em;height:.48em;border:.08em solid var(--fg);background:var(--bg);}
.radio-wave{width:100%;height:1.05em;border:.08em solid var(--mid);overflow:hidden;position:relative;background:var(--lt);}
.radio-bar{position:absolute;top:0;bottom:0;left:-30%;width:30%;background:var(--mid);opacity:.5;animation:radioScan 1.8s linear infinite;}
.radio-playing .radio-bar{background:var(--fg);opacity:.7;}
.radio-indicators{display:flex;gap:.08em;align-items:flex-end;height:.92em;}
.radio-indicators span{width:.18em;background:var(--mid);transform-origin:bottom;animation:radioMeter 1s steps(2) infinite;}
.radio-playing .radio-indicators span{background:var(--fg);}
.radio-indicators span:nth-child(1){height:.24em;animation-delay:0s}
.radio-indicators span:nth-child(2){height:.46em;animation-delay:.08s}
.radio-indicators span:nth-child(3){height:.72em;animation-delay:.16s}
.radio-indicators span:nth-child(4){height:.38em;animation-delay:.24s}
.radio-indicators span:nth-child(5){height:.58em;animation-delay:.32s}
.radio-msg{font-size:.58em;color:var(--mid);text-align:center;line-height:1.25;min-height:1.5em;}
.radio-preset{display:flex;justify-content:space-between;gap:.2em;font-size:.56em;color:var(--mid);letter-spacing:.05em;border-top:.08em dashed var(--mid);padding-top:.12em;}
.radio-btns{display:flex;gap:.2em;width:100%;justify-content:center;font-size:.72em;}
.radio-btn{border:.1em solid var(--mid);padding:.08em .35em;cursor:pointer;letter-spacing:.04em;}
.radio-btn.on{background:var(--fg);color:var(--bg);}
/* PET / TAMAGOTCHI */
#pet-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.pet-stage{flex:1;display:flex;flex-direction:column;padding:.18em .24em .12em;gap:.16em;background:linear-gradient(180deg,var(--lt),var(--bg));}
.pet-head{display:flex;justify-content:space-between;align-items:center;font-size:.58em;color:var(--mid);letter-spacing:.06em;}
.pet-mood{padding:.05em .18em;border:.08em solid var(--mid);letter-spacing:.08em;text-transform:uppercase;}
.pet-canvas-wrap{flex:1;position:relative;border:.08em solid var(--mid);background:var(--bg);overflow:hidden;}
.pet-stats{flex-shrink:0;display:flex;justify-content:space-between;padding:.1em .3em;font-size:.66em;border-bottom:.1em solid var(--mid);}
.pet-statbar{display:inline-flex;gap:.03em;vertical-align:middle;}
.pet-statbar span{width:.28em;height:.5em;border:.07em solid var(--fg);display:inline-block;background:var(--lt);}
.pet-statbar span.f{background:var(--fg);}
#pet-cvs{width:100%;height:100%;display:block;image-rendering:pixelated;}
.pet-note{display:flex;justify-content:space-between;gap:.18em;font-size:.56em;color:var(--mid);line-height:1.2;}
.pet-bubble{padding:.08em .16em;border:.08em dashed var(--mid);}
.pet-acts{flex-shrink:0;display:flex;justify-content:space-around;padding:.12em .16em;border-top:.1em solid var(--mid);font-size:.66em;background:var(--lt);}
.pet-act{border:.08em solid var(--mid);padding:.06em .22em;cursor:pointer;}
.pet-act.s{background:var(--fg);color:var(--bg);}
/* REMINDERS */
.todo-row{display:flex;gap:.2em;align-items:flex-start;padding:.15em .1em;border-bottom:.08em solid var(--mid);cursor:pointer;font-size:.78em;}
.todo-cb{flex-shrink:0;width:.75em;height:.75em;border:.1em solid var(--fg);display:flex;align-items:center;justify-content:center;margin-top:.06em;font-size:.65em;}
.todo-cb.on::after{content:'X';}
.todo-text{flex:1;}
.todo-row.done .todo-text{opacity:.4;text-decoration:line-through;}
.todo-row.s{background:var(--fg);color:var(--bg);}
.todo-row.s .todo-cb{border-color:var(--bg);}
.todo-tag{flex-shrink:0;font-size:.62em;color:var(--mid);border:.07em solid var(--mid);padding:.02em .15em;}
.todo-row.s .todo-tag{color:var(--bg);border-color:var(--bg);}
.todo-cta{background:var(--mid);color:var(--bg);}
/* HOROSCOPE */
.horo-row{display:flex;align-items:center;gap:.25em;padding:.13em .1em;border-bottom:.08em solid var(--mid);cursor:pointer;font-size:.78em;}
.horo-row.s{background:var(--fg);color:var(--bg);}
.horo-sym{font-size:1em;width:1.1em;text-align:center;}
.horo-body{flex:1;overflow-y:auto;padding:.28em .32em;font-size:.78em;line-height:1.4;display:flex;flex-direction:column;gap:.18em;}
.horo-card{border:.08em solid var(--mid);padding:.24em .26em;background:var(--lt);display:flex;flex-direction:column;gap:.16em;position:relative;overflow:hidden;}
.horo-card::after{content:'';position:absolute;inset:.14em;border:.06em dashed rgba(48,98,48,.55);pointer-events:none;}
.horo-kicker{font-size:.6em;color:var(--mid);letter-spacing:.1em;text-transform:uppercase;}
.horo-quote{font-size:.92em;line-height:1.34;position:relative;z-index:1;}
.horo-foot{display:flex;justify-content:space-between;gap:.2em;font-size:.58em;color:var(--mid);letter-spacing:.06em;position:relative;z-index:1;}
.horo-luck{display:grid;grid-template-columns:repeat(3,1fr);gap:.12em;}
.horo-chip{border:.08em solid var(--mid);padding:.12em .14em;text-align:center;font-size:.56em;letter-spacing:.05em;background:var(--lt);}
/* RING SELECT */
.rt-row{display:flex;justify-content:space-between;align-items:center;padding:.15em .1em;border-bottom:.08em solid var(--mid);cursor:pointer;font-size:.78em;}
.rt-row.s{background:var(--fg);color:var(--bg);}
.rt-active{font-size:.62em;color:var(--mid);border:.07em solid var(--mid);padding:.02em .12em;}
.rt-row.s .rt-active{color:var(--bg);border-color:var(--bg);}
/* LCD SWEEP TRANSITION */
@keyframes lcdSweep{0%{transform:scaleY(0);opacity:1}70%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.lcd-sweep{position:absolute;inset:0;background:var(--lt);z-index:150;transform-origin:top;animation:lcdSweep .2s ease-out forwards;pointer-events:none;}
/* MISSED CALL CTA */
.li-main{display:flex;flex-direction:column;gap:.04em;}
.li.missed-cta{position:relative;align-items:flex-start;gap:.2em;border:.08em solid var(--fg);border-left:.28em solid var(--fg);background:linear-gradient(90deg,rgba(15,56,15,.1),rgba(15,56,15,0) 70%);padding:.24em .16em;margin-bottom:.12em;}
.li.missed-cta::before{content:'MISSED';font-size:.5em;letter-spacing:.12em;color:var(--bg);background:var(--fg);padding:.08em .18em;border-radius:2px;margin-top:.02em;}
.li.missed-cta .li-sub{color:var(--fg);}
.li-cta{margin-left:auto;align-self:center;font-size:.54em;letter-spacing:.08em;padding:.08em .18em;border:.08em solid var(--fg);}
.feature-card{position:relative;overflow:hidden;border:.1em solid var(--fg);background:linear-gradient(180deg,var(--lt),var(--bg));padding:.3em .3em .24em;display:flex;flex-direction:column;gap:.16em;min-height:7.2em;margin-bottom:.18em;cursor:pointer;}
.feature-card::after{content:'';position:absolute;inset:.14em;border:.06em dashed rgba(48,98,48,.55);pointer-events:none;}
.feature-kicker{font-size:.58em;color:var(--mid);letter-spacing:.12em;text-transform:uppercase;position:relative;z-index:1;}
.feature-title{font-size:1.12em;line-height:.95;max-width:9ch;position:relative;z-index:1;}
.feature-copy{font-size:.72em;line-height:1.25;max-width:24ch;position:relative;z-index:1;}
.feature-meta{display:flex;flex-wrap:wrap;gap:.12em;position:relative;z-index:1;}
.feature-pill{font-size:.56em;padding:.08em .16em;border:.08em solid var(--mid);letter-spacing:.06em;background:rgba(15,56,15,.04);}
.feature-cta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding:.14em .18em;background:var(--fg);color:var(--bg);font-size:.66em;letter-spacing:.06em;position:relative;z-index:1;}
.feature-card + .li.s{display:none;}
@keyframes radioScan{from{left:-30%}to{left:100%}}
@keyframes radioMeter{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes petBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* SOFT KEY BAR TAPPABLE */
.sk{cursor:default;}
.sk span:not(:empty){cursor:pointer;padding:.12em .45em;border-radius:2px;transition:background .08s;}
.sk span:not(:empty):active{background:var(--mid);color:var(--bg);}
/* IDLE ACTION BAR */
.idle-acts{width:100%;display:flex;gap:.1em;}

function vol(){const p=PROFILES[S.profile];return p.vol*S.volume;}
function tone(f,d=80,v=0.1,t='square',delay=0){
  if(vol()<=0)return;
  try{const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.type=t;o.frequency.value=f;
    const T=ctx.currentTime+delay;
    g.gain.setValueAtTime(v*vol(),T);g.gain.exponentialRampToValueAtTime(0.001,T+d/1000);
    o.start(T);o.stop(T+d/1000+0.02);}catch(e){}
}

function radioStatusText(){
  if(S.radioBusy)return 'TUNING SIGNAL...';
  if(S.radioError)return S.radioError;
  return S.radioPlaying?'LIVE HTTPS STREAM':'PRESS PLAY TO TUNE IN';
}
function ensureRadioAudio(){
  let audio=document.getElementById('_radio_audio');
  if(audio)return audio;
  audio=document.createElement('audio');
  audio.id='_radio_audio';
  audio.style.display='none';
  audio.crossOrigin='anonymous';
  audio.preload='none';
  audio.playsInline=true;
  audio.addEventListener('playing',()=>{
    S.radioPlaying=true;S.radioBusy=false;S.radioError='';
    if(S.screen==='radio')rRadio();
  });
  audio.addEventListener('waiting',()=>{
    S.radioBusy=true;
    if(S.screen==='radio')rRadio();
  });
  audio.addEventListener('stalled',()=>{
    S.radioBusy=false;S.radioPlaying=false;S.radioError='STREAM RECONNECT';
    if(S.screen==='radio')rRadio();
  });
  audio.addEventListener('error',()=>{
    S.radioBusy=false;S.radioPlaying=false;S.radioError='STREAM UNAVAILABLE';
    if(S.screen==='radio')rRadio();
  });
  document.body.appendChild(audio);
  return audio;
}
function playRadioStation(){
  const st=RADIO_STATIONS[S.radioIdx];
  const audio=ensureRadioAudio();
  S.radioBusy=true;S.radioError='';
  audio.pause();
  audio.src=st.stream;
  audio.load();
  const p=audio.play();
  if(p&&p.catch){
    p.catch(err=>{
      S.radioBusy=false;S.radioPlaying=false;
      const msg=String(err&&((err.name||'')+' '+(err.message||''))).toUpperCase();
      S.radioError=msg.includes('NOTALLOWED')?'PRESS PLAY AGAIN':'PLAYBACK BLOCKED';
      if(S.screen==='radio')rRadio();
    });
  }
}

function rCalc(){
  setApp(`
    <div class="atitle"><span>► CALC</span><span class="back-btn" onclick="act('leftsoft')">◄ BACK</span></div>
    <div class="abody">
      <div class="calc-op">${S.calcPrev!==null?S.calcPrev+' '+S.calcOp:''}</div>
      <div class="calc-d">${S.calcDisp}</div>
      <p style="font-size:.68em;color:var(--mid)">0-9: digits · *: × · #: ÷<br>OK: = · Back: clear · End: ±</p>
    </div>
    <div class="sk"><span>BACK</span><span>=</span></div>`);
}
function calcKey(k){
  if('0123456789'.includes(k)){
    if(S.calcNew){S.calcDisp=k==='0'?'0':k;S.calcNew=false;}
    else S.calcDisp=S.calcDisp==='0'?k:S.calcDisp.length<12?S.calcDisp+k:S.calcDisp;
  }else if(k==='.'){ if(!S.calcDisp.includes('.'))S.calcDisp+='.';S.calcNew=false; }
  else if(k==='op'){
    S.calcPrev=parseFloat(S.calcDisp);S.calcNew=true;
  }else if(k==='eq'){
    if(S.calcPrev!==null&&S.calcOp){
      const a=S.calcPrev,b=parseFloat(S.calcDisp);
      let r;switch(S.calcOp){case'+':r=a+b;break;case'-':r=a-b;break;case'×':r=a*b;break;case'÷':r=b!==0?a/b:0;break;default:r=b;}
      S.calcDisp=parseFloat(r.toFixed(8)).toString();S.calcPrev=null;S.calcOp=null;S.calcNew=true;
    }
  }else if(k==='neg'){S.calcDisp=(-parseFloat(S.calcDisp)).toString();}
  else if(k==='bs'){S.calcDisp=S.calcDisp.length>1?S.calcDisp.slice(0,-1):'0';}
  else if(k==='clr'){S.calcDisp='0';S.calcPrev=null;S.calcOp=null;S.calcNew=true;}
  rCalc();
}

// SNAKE
function rSnake(){
  setApp(`
    <div id="snk-wrap">
      <div class="snk-hd"><span>SNAKE</span><span>▸ ${S.snkScore}</span><span>HI:${S.snkHi}</span></div>
      <canvas id="snk-cvs"></canvas>

function initSnk(){
  const cvs=document.getElementById('snk-cvs');if(!cvs)return;
  const w=cvs.parentElement.clientWidth,h=cvs.parentElement.clientHeight-22;
  cvs.width=w;cvs.height=h;
  S.snkCols=Math.floor(w/9);S.snkRows=Math.floor(h/9);
  S.snkActive=false;S.snkOver=false;
  drawSnkStart(cvs);
}
function drawSnkStart(cvs){
  const ctx=cvs.getContext('2d'),w=cvs.width,h=cvs.height;
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
  ctx.font=`bold ${Math.floor(h/7)}px VT323,monospace`;ctx.textAlign='center';
  ctx.fillText('SNAKE',w/2,h/2-h/10);
  ctx.font=`${Math.floor(h/11)}px VT323,monospace`;
  ctx.fillText('OK or 5 to start',w/2,h/2+h/9);
  ctx.fillText('D-pad to move',w/2,h/2+h/5);
}
function startSnk(){
  const cvs=document.getElementById('snk-cvs');if(!cvs)return;
  S.snkActive=true;S.snkOver=false;S.snkScore=0;
  const mx=Math.floor(S.snkCols/2),my=Math.floor(S.snkRows/2);
  S.snake=[{x:mx,y:my},{x:mx-1,y:my},{x:mx-2,y:my}];
  S.snkDir={x:1,y:0};S.snkNext={x:1,y:0};
  spawnSnkFood();
  clearInterval(S.snkT);
  S.snkT=setInterval(snkTick,160);
}
function spawnSnkFood(){
  do{S.snkFood={x:Math.floor(Math.random()*S.snkCols),y:Math.floor(Math.random()*S.snkRows)};
  }while(S.snake.some(s=>s.x===S.snkFood.x&&s.y===S.snkFood.y));
}
function snkTick(){
  if(!S.snkActive||S.snkOver)return;
  S.snkDir={...S.snkNext};
  const h={x:S.snake[0].x+S.snkDir.x,y:S.snake[0].y+S.snkDir.y};
  if(h.x<0||h.x>=S.snkCols||h.y<0||h.y>=S.snkRows||S.snake.some(s=>s.x===h.x&&s.y===h.y)){
    S.snkOver=true;S.snkActive=false;clearInterval(S.snkT);snakeDieSound();drawSnkOver();return;
  }
  S.snake.unshift(h);
  if(h.x===S.snkFood.x&&h.y===S.snkFood.y){
    S.snkScore+=10;if(S.snkScore>S.snkHi)S.snkHi=S.snkScore;
    snakeEatSound();spawnSnkFood();
    const sc=document.querySelector('.snk-hd span:nth-child(2)');if(sc)sc.textContent='▸ '+S.snkScore;
  }else S.snake.pop();
  drawSnk();
}
function drawSnk(){
  const cvs=document.getElementById('snk-cvs');if(!cvs)return;
  const ctx=cvs.getContext('2d'),cw=cvs.width/S.snkCols,ch=cvs.height/S.snkRows;
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const fg=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
  const mid=getComputedStyle(document.documentElement).getPropertyValue('--mid').trim();
  ctx.fillStyle=bg;ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle=mid;
  for(let x=0;x<S.snkCols;x++)for(let y=0;y<S.snkRows;y++)ctx.fillRect(x*cw+cw/2-.5,y*ch+ch/2-.5,1,1);
  ctx.fillStyle=fg;ctx.fillRect(S.snkFood.x*cw+1,S.snkFood.y*ch+1,cw-2,ch-2);
  S.snake.forEach((s,i)=>{ctx.fillStyle=i===0?fg:mid;ctx.fillRect(s.x*cw+.5,s.y*ch+.5,cw-1,ch-1);});
}
function drawSnkOver(){
  const cvs=document.getElementById('snk-cvs');if(!cvs)return;
  const ctx=cvs.getContext('2d'),w=cvs.width,h=cvs.height;
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const fg=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,w,h);
  ctx.fillStyle=bg;
  ctx.font=`bold ${Math.floor(h/7)}px VT323,monospace`;ctx.textAlign='center';
  ctx.fillText('GAME OVER',w/2,h/2-h/12);
  ctx.font=`${Math.floor(h/11)}px VT323,monospace`;
  ctx.fillText('Score: '+S.snkScore,w/2,h/2+h/10);
  ctx.fillText('OK to retry',w/2,h/2+h/5);
}
function stopSnk(){clearInterval(S.snkT);S.snkT=null;S.snkActive=false;}

    </div>`);

function setCamF(i){S.camFilter=i;rCamera();}
let _vfFrame=0;
function startVF(){
  const cvs=document.getElementById('cam-cvs');if(!cvs||S.screen!=='camera')return;
  const vf=cvs.parentElement;cvs.width=vf.clientWidth;cvs.height=vf.clientHeight;
  drawVF(cvs);
}
function drawVF(cvs){
  if(S.screen!=='camera')return;
  const ctx=cvs.getContext('2d'),w=cvs.width,h=cvs.height;_vfFrame++;
  ctx.fillStyle='#9bbc0f';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#8bac0f';ctx.fillRect(0,0,w,h*.55);
  ctx.fillStyle='#9bbc0f';
  ctx.beginPath();ctx.ellipse(w*.3,h*.6,w*.25,h*.16,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(w*.72,h*.57,w*.22,h*.13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#306230';ctx.fillRect(0,h*.65,w,h*.35);
  const sx=w*.72+Math.sin(_vfFrame*.04)*4;
  ctx.fillStyle='#0f380f';ctx.beginPath();ctx.arc(sx,h*.14,h*.055,0,Math.PI*2);ctx.fill();
  for(let i=0;i<2;i++){ctx.fillStyle='rgba(15,56,15,.1)';ctx.fillRect(0,Math.floor(Math.random()*h),w,1);}
  ctx.strokeStyle='#0f380f';ctx.lineWidth=1.5;
  const bw=w*.055,bh=h*.055,pad=w*.05;
  [[pad,pad,1,1],[w-pad-bw,pad,-1,1],[pad,h-pad-bh,1,-1],[w-pad-bw,h-pad-bh,-1,-1]].forEach(([x,y,sx2,sy2])=>{
    ctx.beginPath();ctx.moveTo(x,y+bh*sy2*-1+bh*sy2);ctx.lineTo(x,y);ctx.lineTo(x+bw*sx2,y);ctx.stroke();
  });
  const fMap=['grayscale(0%) sepia(40%) hue-rotate(50deg)','invert(90%)','contrast(4) blur(.8px)'];
  cvs.style.filter=fMap[S.camFilter]||'';
  S.camAnimReq=requestAnimationFrame(()=>drawVF(cvs));
}

  h+='</span>';return h;
}

// SIGNAL + BATTERY
function fluctuateSignal(){
  S.signal=Math.max(1,Math.min(5,S.signal+(Math.random()<.5?1:-1)));
  updateSB();
  S.signalT=setTimeout(fluctuateSignal,Math.random()*10000+8000);
}
function drainBattery(){
  if(!S.charging&&S.battery>5){S.battery-=1;updateSB();
    if(S.battery<=15&&S.battery>14){tone(440,200,.1,'sine');setTimeout(()=>{if(S.screen==='idle'){const pop=document.createElement('div');pop.className='mpop';pop.innerHTML='🔋 Low Battery!';$app().appendChild(pop);setTimeout(()=>pop.remove(),3000);}},100);}
  }
  if(S.charging&&S.battery<100)S.battery=Math.min(100,S.battery+2);
  S.batT=setTimeout(drainBattery,180000);
}

function flashBtn(a){
  const el=document.querySelector(`[data-a="${a}"]`);
  if(el){el.classList.add('pr');setTimeout(()=>el.classList.remove('pr'),100);}
}

function act(a){
  try{ac();}catch(e){}  // resume audio context
  tick();flashBtn(a);S.lastInput=Date.now();resetSS();
  if(S.locked){actLocked(a);return;}
  // shortcut buttons — work from any screen
  if(a==='home-short'){stopSnk();stopCam();clearSS();S.menuGroup=0;S.menuIdx=0;S.stack=[];go('menu');return;}
  if(a==='cal-short') {stopSnk();stopCam();clearSS();S.stack=[];pushGo('calendar');return;}
  if(a==='cont-short'){stopSnk();stopCam();clearSS();S.stack=[];pushGo('links');return;}
  if(a==='end'&&S.screen!=='calling'){
    stopRing();if(S.callInterval){clearInterval(S.callInterval);S.callInterval=null;}
    if(S.dialDigits){S.dialDigits='';if(S.screen==='idle')rIdle();return;}
    goIdle();return;
  }
  switch(S.screen){
    case 'boot': case 'sim': goIdle(); return;
    case 'idle':    actIdle(a);    break;
    case 'menu':    actMenu(a);    break;
    case 'calling': actCalling(a); break;
    case 'home': case 'about': case 'portfolio': actSimpleBack(a); break;
    case 'links':   actLinks(a);   break;

    case 'book':    actBook(a);    break;
    case 'contacts':actContacts2(a);break;
    case 'messages':actMsgs(a);    break;
    case 'msg_view':actMsgView(a); break;
    case 'calllog': actCallLog(a); break;
    case 'calculator':actCalc(a);  break;
    case 'alarm':   actAlarm(a);   break;
    case 'stopwatch':actSW(a);     break;
    case 'calendar':actCal(a);     break;
    case 'notes':   actNotes(a);   break;
    case 'note_view':actNoteView(a);break;
    case 'worldclock':actSimpleBack(a);break;
    case 'ringtone':actRT(a);      break;
    case 'snake':   actSnake(a);   break;
    case 'camera':  actCam(a);     break;
    case 'gallery': actGallery(a); break;
    case 'settings':actSett(a);    break;
    case 'profiles':actProfiles(a);break;
    case 'lock':    actLocked(a);  break;
    case 'ringselector':actRingSel(a);break;
    case 'reminders':actReminders(a);break;
    case 'horoscope':actHoroscope(a);break;
    case 'radio':   actRadioA(a);  break;
    case 'tamagotchi':actPet(a);   break;
  }
}

function actIdle(a){
  if('0123456789'.includes(a)){dtmf(a);S.dialDigits+=a;rIdle();return;}
  if(a==='star'){S.dialDigits+='*';rIdle();return;}
  if(a==='hash'){pushGo('profiles');return;}
  if(a==='back'||a==='end'){S.dialDigits=S.dialDigits.slice(0,-1);rIdle();return;}
  if(a==='call'){
    if(S.dialDigits)startCall(S.dialDigits,S.dialDigits);
    else startCall('Voicemail','1');
    return;
  }
  // Navigation only — move focus, never open
  if(a==='left'){S.idleIdx=Math.max(0,S.idleIdx-1);navSound();rIdle();return;}
  if(a==='right'){S.idleIdx=Math.min(1,S.idleIdx+1);navSound();rIdle();return;}
  if(a==='down'){S.idleIdx=Math.min(1,S.idleIdx+1);navSound();rIdle();return;}
  // Soft keys — navigate only, same as left/right
  if(a==='leftsoft'){S.idleIdx=Math.max(0,S.idleIdx-1);navSound();rIdle();return;}
  if(a==='rightsoft'){S.idleIdx=Math.min(1,S.idleIdx+1);navSound();rIdle();return;}
  // Confirm — open the currently highlighted idle item
  if(a==='ok'){
    if(S.idleIdx===1){stopSnk();stopCam();clearSS();S.stack=[];pushGo('links');}
    else{S.menuGroup=0;S.menuIdx=0;S.stack=[];go('menu');}
    return;
  }
  // Up always opens menu
  if(a==='up'){S.menuGroup=0;S.menuIdx=0;S.stack=[];go('menu');return;}
}

function actMenu(a){
  const len=MENU_G.flatMap(g=>g.items).length,cols=4;
  const row=Math.floor(S.menuIdx/cols),col=S.menuIdx%cols;
  if(a==='up'){if(row>0){S.menuIdx-=cols;navSound();}}
  else if(a==='down'){if(S.menuIdx+cols<len){S.menuIdx+=cols;navSound();}}
  else if(a==='left'){if(S.menuIdx>0){S.menuIdx--;navSound();}}
  else if(a==='right'){if(S.menuIdx<len-1){S.menuIdx++;navSound();}}
  else if(a==='ok'||a==='rightsoft'){selMenu();return;}
  else if(a==='back'||a==='leftsoft'||a==='end'){backSound();goIdle();return;}
  rMenu();
}

function actCalling(a){
  if(a==='end'||a==='back'){stopRing();clearInterval(S.callInterval);S.callInterval=null;backSound();goIdle();}
}

function actLinks(a){
  // Navigation — move selection only
  if(a==='up'||a==='left'){S.linksIdx=Math.max(0,S.linksIdx-1);navSound();rLinks();}
  else if(a==='down'||a==='right'){S.linksIdx=Math.min(1,S.linksIdx+1);navSound();rLinks();}
  // Soft keys follow screen labels: BACK / OPEN
  else if(a==='rightsoft'||a==='ok'||a==='call'){selSound();const links=['https://www.linkedin.com/in/marketingwithcats/','https://www.instagram.com/mydigitalcrib/'];openUrl(links[S.linksIdx]);}
  else if(a==='leftsoft'||a==='back'||a==='end'){backSound();back();}
}

function actBook(a){
  // Soft keys follow screen labels: BACK / BOOK
  if(a==='ok'||a==='call'||a==='rightsoft'){selSound();startCall('Book a Call','welcometomywebsites.com','https://calendar.app.google/QsBw6Drjn2dTkxez6');}
  else if(a==='leftsoft'||a==='back'||a==='end'){backSound();back();}
}

function actContacts2(a){
  if(a==='up'){S.contIdx=Math.max(0,S.contIdx-1);navSound();rContacts();}
  else if(a==='down'){S.contIdx=Math.min(CONTACTS_D.length-1,S.contIdx+1);navSound();rContacts();}
  // Soft keys follow screen labels: BACK / CALL
  else if(a==='ok'||a==='call'||a==='rightsoft'){selSound();const c=CONTACTS_D[S.contIdx];startCall(c.name,c.num);}
  else if(a==='leftsoft'||a==='back'||a==='end'){backSound();back();}
}

function actMsgs(a){
  if(a==='up'){S.msgIdx=Math.max(0,S.msgIdx-1);navSound();rMsgs();}
  else if(a==='down'){S.msgIdx=Math.min(MSGS_D.length-1,S.msgIdx+1);navSound();rMsgs();}
  // Soft keys follow screen labels: BACK / READ
  else if(a==='ok'||a==='rightsoft'){S.screen='msg_view';S.stack.push('messages');selSound();rMsgView();}
  else if(a==='leftsoft'||a==='back'||a==='end'){backSound();back();}
}

function actCallLog(a){
  if(a==='left'||a==='right'){S.callLogTab=(a==='left'?(S.callLogTab-1+3)%3:(S.callLogTab+1)%3);navSound();rCallLog();}
  // Soft keys follow screen labels: BACK / (empty)
  else if(a==='leftsoft'||a==='back'||a==='end'){backSound();back();}
}

function actCalc(a){
  if('0123456789'.includes(a)){dtmf(a);calcKey(a);}
  else if(a==='star'){S.calcOp='×';S.calcPrev=parseFloat(S.calcDisp);S.calcNew=true;rCalc();}
  else if(a==='hash'){S.calcOp='÷';S.calcPrev=parseFloat(S.calcDisp);S.calcNew=true;rCalc();}
  else if(a==='ok'){selSound();calcKey('eq');}
  else if(a==='up'){S.calcOp='+';S.calcPrev=parseFloat(S.calcDisp);S.calcNew=true;rCalc();}
  else if(a==='down'){S.calcOp='-';S.calcPrev=parseFloat(S.calcDisp);S.calcNew=true;rCalc();}
  else if(a==='back'){backSound();calcKey('bs');}
  else if(a==='leftsoft'){backSound();calcKey('clr');}
  else if(a==='end'){calcKey('neg');rCalc();}
  else if(a==='menu'||a==='rightsoft'){backSound();back();}
}

function actAlarm(a){
  if(S.alarmFiring){S.alarmFiring=false;clearTimeout(S.alarmT);rAlarm();return;}
  if(a==='left'){S.alarmField=0;navSound();rAlarm();}
  else if(a==='right'){S.alarmField=1;navSound();rAlarm();}
  else if(a==='up'){if(S.alarmField===0)S.alarmH=(S.alarmH+1)%24;else S.alarmM=(S.alarmM+1)%60;navSound();rAlarm();}
  else if(a==='down'){if(S.alarmField===0)S.alarmH=(S.alarmH-1+24)%24;else S.alarmM=(S.alarmM-1+60)%60;navSound();rAlarm();}
  else if(a==='ok'||a==='rightsoft'){S.alarmOn=!S.alarmOn;selSound();rAlarm();}
  else if(a==='back'||a==='leftsoft'){backSound();back();}
}

function actSW(a){
  if(a==='ok'||a==='rightsoft'){
    if(S.swRun){S.swElapsed+=Date.now()-S.swStart;S.swStart=null;S.swRun=false;clearTimeout(S.swT);}
    else{S.swStart=Date.now();S.swRun=true;}
    selSound();rSW();
  }
  else if(a==='leftsoft'){S.swRun=false;S.swElapsed=0;clearTimeout(S.swT);selSound();rSW();}
  else if(a==='back'){backSound();back();}
}

function actCal(a){
  if(a==='left'){S.calM--;if(S.calM<0){S.calM=11;S.calY--;}navSound();rCal();}
  else if(a==='right'){S.calM++;if(S.calM>11){S.calM=0;S.calY++;}navSound();rCal();}
  else if(a==='ok'||a==='rightsoft'){const n=new Date();S.calM=n.getMonth();S.calY=n.getFullYear();rCal();}
  else if(a==='back'||a==='leftsoft'){backSound();back();}
}

function actRT(a){
  if('12345678'.includes(a)){
    const labels=['C','D','E','F','G','A','B','R'];
    const idx=parseInt(a)-1;
    S.rtNotes.push({label:labels[idx],freq:NOTES_FREQ[parseInt(a)]});
    if(NOTES_FREQ[parseInt(a)]>0)tone(NOTES_FREQ[parseInt(a)],200,.08,'sine');
    rRT();
  }
  else if(a==='leftsoft'){playRT();}
  else if(a==='rightsoft'){S.rtNotes=[];rRT();}
  else if(a==='back'){if(S.rtNotes.length>0){S.rtNotes.pop();rRT();}else{backSound();back();}}
}

function actSnake(a){
  if(!S.snkActive||S.snkOver){
    if(a==='ok'||a==='5'||a==='menu'){startSnk();}
    else if(a==='back'||a==='end'){backSound();stopSnk();back();}
    return;
  }
  const d=S.snkDir;
  if((a==='up'||a==='2')&&d.y!==1)  S.snkNext={x:0,y:-1};
  if((a==='down'||a==='8')&&d.y!==-1)S.snkNext={x:0,y:1};
  if((a==='left'||a==='4')&&d.x!==1) S.snkNext={x:-1,y:0};
  if((a==='right'||a==='6')&&d.x!==-1)S.snkNext={x:1,y:0};
  if(a==='back'||a==='end'){backSound();stopSnk();back();}
}

function actCam(a){
  if(a==='left'){setCamF((S.camFilter+2)%3);}
  else if(a==='right'){setCamF((S.camFilter+1)%3);}
  else if(a==='ok'||a==='5'){snapPhoto();}
  else if(a==='back'||a==='leftsoft'){backSound();stopCam();back();}
}

function actSett(a){
  if(a==='up'){S.settIdx=Math.max(0,S.settIdx-1);navSound();rSettings();}
  else if(a==='down'){S.settIdx=Math.min(SETT_ITEMS.length-1,S.settIdx+1);navSound();rSettings();}
  else if(a==='left'){settChange(-1);}
  else if(a==='right'){settChange(1);}
  else if(a==='ok'||a==='rightsoft'){settChange(1);}
  else if(a==='back'||a==='leftsoft'){backSound();back();}
}

function actProfiles(a){
  const keys=Object.keys(PROFILES);
  const ci=keys.indexOf(S.profile);
  if(a==='up'){S.profile=keys[Math.max(0,ci-1)];navSound();rProfiles();}
  else if(a==='down'){S.profile=keys[Math.min(keys.length-1,ci+1)];navSound();rProfiles();}
  else if(a==='ok'||a==='rightsoft'){selSound();updateSB();}
  else if(a==='back'||a==='leftsoft'){backSound();back();}
}

function actRingSel(a){
  const len=Object.keys(RINGTUNES).length;
  if(a==='up'){S.ringSelIdx=Math.max(0,S.ringSelIdx-1);navSound();rRingSelector();}
  else if(a==='down'){S.ringSelIdx=Math.min(len-1,S.ringSelIdx+1);navSound();rRingSelector();}
  else if(a==='ok'){previewRingtone();}
  else if(a==='rightsoft'){setRingtone();}
  else if(a==='back'||a==='leftsoft'){backSound();back();}
}
function actReminders(a){
  if(a==='up'){S.todoIdx=Math.max(0,S.todoIdx-1);navSound();rReminders();}
  else if(a==='down'){S.todoIdx=Math.min(S.todos.length-1,S.todoIdx+1);navSound();rReminders();}
  else if(a==='ok'||a==='rightsoft'){toggleTodo(S.todoIdx);}

function actRadioA(a){
  if(a==='ok'||a==='rightsoft'){radioToggle();}
  else if(a==='left'){radioNext(-1);}
  else if(a==='right'){radioNext(1);}

function actPet(a){

}

function drawPet(){
  const cvs=document.getElementById('pet-cvs');if(!cvs||S.screen!=='tamagotchi')return;
  const wrap=cvs.parentElement;
  cvs.width=wrap.clientWidth;cvs.height=wrap.clientHeight;
  const ctx=cvs.getContext('2d');
  const w=cvs.width,h=cvs.height;
  const style=getComputedStyle(document.documentElement);
  const bg=style.getPropertyValue('--bg').trim();
  const fg=style.getPropertyValue('--fg').trim();
  const mid=style.getPropertyValue('--mid').trim();
  const lt=style.getPropertyValue('--lt').trim();
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  ctx.fillStyle=mid;
  for(let x=0;x<w;x+=8)for(let y=0;y<h;y+=8)ctx.fillRect(x,y,1,1);
  ctx.fillStyle=lt;ctx.fillRect(0,Math.floor(h*.76),w,Math.ceil(h*.24));
  ctx.fillStyle=mid;ctx.fillRect(0,Math.floor(h*.76),w,2);
  const cell=Math.max(4,Math.floor(Math.min(w,h)/24));
  const bob=S.petState==='excited'?Math.sin(Date.now()/120)*3:Math.sin(Date.now()/240)*1.5;
  const ox=Math.floor((w-PET_BODY[0].length*cell)/2);
  const oy=Math.floor(h*.18+bob);
  const shadowW=cell*10;
  ctx.fillStyle=mid;
  ctx.fillRect(Math.floor(w/2-shadowW/2),Math.floor(h*.72),shadowW,cell);
  ctx.fillStyle=fg;
  PET_BODY.forEach((row,y)=>{
    [...row].forEach((ch,x)=>{
      if(ch==='1')ctx.fillRect(ox+x*cell,oy+y*cell,cell,cell);
    });
  });
  const mood=petMoodCopy();
  drawPixelCells(ctx,mood.face,bg,ox,oy,cell);
  drawPixelCells(ctx,mood.accent,mid,ox,oy,cell);
  const prop=PET_PROPS[S.petActIdx];
  if(prop){
    const px=ox-cell*2;
    const py=Math.floor(h*.76)-cell*5;
    prop.forEach((row,y)=>{
      [...row].forEach((ch,x)=>{
        if(ch==='1')ctx.fillStyle=fg;
        else if(ch==='2')ctx.fillStyle=mid;
        else return;
        ctx.fillRect(px+x*cell,py+y*cell,cell,cell);
      });
    });
  }
  ctx.fillStyle=fg;
  ctx.font=`${Math.max(10,cell*1.6)}px VT323,monospace`;
  ctx.textAlign='center';
  ctx.fillText('PIXEL',w/2,h-6);
  cancelAnimationFrame(S.petAnimT);
  S.petAnimT=requestAnimationFrame(drawPet);
}

function drawMeme(c,m,W,H){
  const isNyan=m.exp==='nyan', isFire=m.exp==='fire', isPeek=m.exp==='peek';
  // ── background ──
  if(isNyan){
    ['#ff5555','#ffaa44','#ffff44','#55cc55','#4488ff','#cc55ff'].forEach((col,i)=>{c.fillStyle=col;c.fillRect(0,i*(H/6),W,H/6);});
  } else if(isFire){
    c.fillStyle='#120800';c.fillRect(0,0,W,H);
  } else {
    c.fillStyle='#c8d0b0';c.fillRect(0,0,W,H);
  }
  // ── nyan trail + stars ──
  if(isNyan){
    ['#ff5555','#ffaa44','#ffff44','#55cc55','#4488ff'].forEach((col,i)=>{c.fillStyle=col;c.fillRect(0,46+i*5,50,5);});
    c.fillStyle='#fff';
    [[6,8],[20,22],[8,42],[28,6],[4,58],[18,52]].forEach(([sx,sy])=>{c.fillRect(sx,sy,4,4);c.fillRect(sx+4,sy-4,2,2);c.fillRect(sx-2,sy+4,2,2);});
  }
  // ── fire flames (drawn first so cat sits on top) ──
  if(isFire){
    [10,26,44,82,100,118,140].forEach(fx=>{
      c.fillStyle='#ff4400';c.beginPath();c.moveTo(fx,H);c.lineTo(fx-5,H-16);c.lineTo(fx,H-26);c.lineTo(fx+5,H-16);c.lineTo(fx+10,H);c.fill();
      c.fillStyle='#ffaa00';c.beginPath();c.moveTo(fx+2,H);c.lineTo(fx,H-10);c.lineTo(fx+3,H-18);c.lineTo(fx+6,H-10);c.lineTo(fx+8,H);c.fill();
    });
  }
  // ── color vars ──
  const catCol = isNyan ? '#fff' : '#1a1a1a';
  // eye white: always contrasting against catCol
  const eyeCol = isNyan ? '#222' : isFire ? '#ffdd99' : '#c8d0b0';
  const pupCol = isNyan ? '#fff' : '#1a1a1a';
  // ── CEILING CAT (peek from top, text at bottom) ──
  if(isPeek){
    c.fillStyle=catCol;
    c.fillRect(44,0,72,45);          // head (clips at top)
    c.fillRect(38,0,14,18);          // left ear — sticks left of head
    c.fillRect(108,0,14,18);         // right ear — sticks right of head
    // eye whites
    c.fillStyle=eyeCol;c.fillRect(54,14,14,12);c.fillRect(92,14,14,12);
    // pupils (centred in eye whites)
    c.fillStyle=catCol;c.fillRect(59,17,5,9);c.fillRect(97,17,5,9);
    // nose
    c.fillStyle='#888';c.fillRect(77,32,6,4);
    // whiskers
    c.strokeStyle=catCol;c.lineWidth=1;
    [[8,34,44,34],[8,38,44,38],[116,34,152,34],[116,38,152,38]].forEach(([x1,y1,x2,y2])=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();});
    // text at bottom (no overlap with face)
    c.font='bold 9px monospace';c.textAlign='center';
    c.fillStyle='#1a1a1a';
    if(m.top)c.fillText(m.top,W/2,H-16);
    if(m.bot){c.font='bold 10px monospace';c.fillText(m.bot,W/2,H-4);}
    return;
  }
  // ── REGULAR CATS ──
  c.fillStyle=catCol;
  c.fillRect(48,22,64,50);           // head
  c.fillRect(48,6,17,20);            // left ear
  c.fillRect(95,6,17,20);            // right ear
  // eye whites — grumpy: inner corner raised (shifted down 2px)
  c.fillStyle=eyeCol;
  if(m.exp==='grumpy'){
    c.fillRect(55,32,14,10);c.fillRect(91,32,14,10);
    // inner brow cover to make angled look
    c.fillStyle=catCol;c.fillRect(55,32,6,3);c.fillRect(105,32,6,3);
    c.fillStyle=eyeCol;
  } else {
    c.fillRect(55,26,14,12);c.fillRect(91,26,14,12);
  }
  // pupils (always 4px below eye white top so white shows above)
  c.fillStyle=pupCol;
  if(m.exp==='grumpy'){c.fillRect(59,35,5,8);c.fillRect(95,35,5,8);}
  else{c.fillRect(59,30,5,9);c.fillRect(95,30,5,9);}
  // nose
  c.fillStyle='#888';c.fillRect(77,47,6,4);
  // mouth
  c.fillStyle=catCol;
  if(m.exp==='grumpy'){
    c.fillRect(65,55,6,2);c.fillRect(89,53,6,2); // asymmetric frown
  } else if(m.exp==='happy'){
    c.fillRect(63,53,7,2);c.fillRect(90,53,7,2);
    c.fillRect(70,55,20,2);           // wide smile
  } else {
    c.fillRect(71,52,6,2);c.fillRect(83,52,6,2);
  }
  // whiskers
  c.strokeStyle=catCol;c.lineWidth=1;
  [[10,46,48,46],[10,50,48,50],[112,46,150,46],[112,50,150,50]].forEach(([x1,y1,x2,y2])=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();});
  // biz tie (below head: head ends at y=72)
  if(m.exp==='biz'){c.fillStyle=catCol;c.fillRect(73,72,14,26);c.fillRect(68,72,24,8);}
  // ── text ──
  const tc = isFire?'#ffdd00':isNyan?'#ffffff':'#1a1a1a';
  c.font='bold 9px monospace';c.textAlign='center';
  if(isFire||isNyan){
    c.strokeStyle='#000';c.lineWidth=3;
    if(m.top)c.strokeText(m.top,W/2,12);
    if(m.bot)c.strokeText(m.bot,W/2,H-4);
  }
  c.fillStyle=tc;
  if(m.top)c.fillText(m.top,W/2,12);
  if(m.bot)c.fillText(m.bot,W/2,H-4);
}

applyTheme('mono');
setInterval(updateSB,30000);
fluctuateSignal();
drainBattery();
setInterval(checkAlarm,30000);
// Pet stat decay every 2 minutes
setInterval(()=>{
  S.petHunger=Math.max(0,S.petHunger-3);
  S.petHappy=Math.max(0,S.petHappy-2);
  S.petAge=Math.floor((Date.now()-(S._petBorn||Date.now()))/60000);
  updatePetState();
},120000);
S._petBorn=Date.now();
buildGallery();
go('sim',true);
</script>

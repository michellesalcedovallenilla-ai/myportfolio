<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Room — labeled</title>
<style>
  :root {
    --c-sprite: #00ff9d;
    --c-region: #ff9d00;
    --tag-bg: rgba(0,0,0,.82);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#0d0f12; overflow:hidden; }
  .scene {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    aspect-ratio: 16/9; max-width:100vw; max-height:100vh; width:min(100vw, 177.78vh);
  }
  .scene > img.bg { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  .el { position:absolute; }
  .el img { width:100%; display:block; image-rendering:pixelated; }
  .region { height:auto; }

  /* ---- debug labels (toggle with the button or pressing L) ---- */
  .labeled .sprite { outline:3px solid var(--c-sprite); outline-offset:2px; }
  .labeled .pantalla { outline:3px solid #00cfff; outline-offset:-3px; }
  .pantalla .tag { border:1px solid #00cfff; color:#aee9ff; }
  .labeled .boton { outline:3px solid #ff4d6d; outline-offset:2px; border-radius:50%; }
  .boton .tag { border:1px solid #ff4d6d; color:#ffc2ce; }
  .labeled .region { outline:3px dashed var(--c-region); outline-offset:2px; }
  .tag {
    position:absolute; top:-1.6em; left:0;
    font:600 clamp(9px, 1.1vw, 15px)/1.2 ui-monospace, monospace;
    color:#fff; background:var(--tag-bg); padding:2px 7px; border-radius:4px;
    white-space:nowrap; pointer-events:none; display:none;
  }
  .sprite .tag { border:1px solid var(--c-sprite); }
  .region .tag { border:1px solid var(--c-region); color:#ffd9a0; }
  .labeled .tag { display:block; }

  /* ---- pantalla click-catcher + expanded internal screen ---- */
  .pantalla { overflow:hidden; background:#000; }
  .pantalla iframe {
    width:125%; height:125%; border:0; display:block; background:#000;
    transform:scale(0.8); transform-origin:0 0;
  }
  .pantalla-click { position:absolute; inset:0; cursor:pointer; z-index:5; }
  .labeled .pantalla-click { inset:3px; }
  /* PC apagada */
  .pantalla.off iframe { opacity:0; }
  .pantalla.off .pantalla-click { pointer-events:none; }

  /* ---- interacciones ---- */
  #el-speaker, #el-keyboard, #el-cat, #el-lamp { cursor:pointer; }
  #el-keyboard:active img { transform:translateY(3px); }
  #el-speaker.playing img { animation:speakerPulse .5s infinite alternate ease-in-out; }
  @keyframes speakerPulse { from { transform:scale(1); } to { transform:scale(1.06); } }

  .boton { cursor:pointer; }
  .boton.pressed { filter:brightness(.6); }

  /* lampara: brillo calido cuando esta encendida */
  #el-lamp img { transition:filter .35s; }
  #el-lamp.on img { filter:brightness(1.35) drop-shadow(0 0 12px rgba(255,190,80,.9)); }
  .lamp-glow {
    position:absolute; left:66%; top:8%; width:40%; height:60%;
    background:radial-gradient(ellipse 50% 50% at 64% 46%, rgba(255,196,92,.55) 0%, rgba(255,175,65,.26) 45%, transparent 100%);
    mix-blend-mode:screen; opacity:0; transition:opacity .45s; pointer-events:none; z-index:8;
  }
  .scene.lamp-on .lamp-glow { opacity:1; }

  /* poster: notificacion estilo XP */
  #bg-poster { cursor:pointer; }
  .xp-notif {
    position:absolute; left:24.8%; top:12.5%; width:23%; z-index:60;
    display:none; font:600 clamp(10px,1.05vw,15px)/1.35 Tahoma, Verdana, sans-serif;
    filter:drop-shadow(5px 5px 0 rgba(0,0,0,.45));
  }
  .xp-notif.show { display:block; animation:notifPop .28s cubic-bezier(.2,1.4,.4,1); }
  @keyframes notifPop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  .xp-notif-title {
    background:linear-gradient(180deg,#4a90e2,#2753a8); color:#fff;
    border:3px solid #16356b; border-bottom:none; border-radius:8px 8px 0 0;
    padding:5px 10px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .xp-notif-title button {
    background:#c75050; color:#fff; border:2px solid #fff; border-radius:4px;
    font:700 .9em Tahoma, sans-serif; padding:0 6px; cursor:pointer; line-height:1.3;
  }
  .xp-notif-body {
    background:#ffffe1; border:3px solid #16356b; border-radius:0 0 8px 8px;
    padding:12px 14px; color:#1c1c1c;
  }
  .xp-notif-body b { color:#0b7a3b; font-size:1.15em; }
  .xp-notif::after {
    content:''; position:absolute; left:-14px; top:38px;
    border:8px solid transparent; border-right-color:#16356b;
  }

  /* zzz del gato */
  .zzz {
    position:absolute; left:11.5%; top:42%; width:5.5%;
    opacity:0; pointer-events:none; transition:opacity .3s; z-index:8;
  }
  .zzz img { width:100%; display:block; image-rendering:pixelated; }
  .zzz.show { opacity:1; }
  .zzz.show img { animation:zzzFloat 2.2s infinite ease-in-out; }
  @keyframes zzzFloat {
    0%   { transform:translateY(0); }
    50%  { transform:translateY(-14%); }
    100% { transform:translateY(0); }
  }

  /* luces de la ciudad parpadeando en la ventana */
  .city-light { position:absolute; width:.36%; height:1.5%; z-index:2; opacity:0; pointer-events:none; }
  .city-light.tw {
    background:#ffe9b0; box-shadow:0 0 7px 2px rgba(255,222,140,.85);
    animation:twPulse var(--d,3s) infinite ease-in-out; animation-delay:var(--dl,0s);
  }
  @keyframes twPulse { 0%,100% { opacity:.12; } 50% { opacity:1; } }
  .city-light.off {
    background:#221332;
    animation:twOff var(--d,6s) infinite steps(1); animation-delay:var(--dl,0s);
  }
  @keyframes twOff { 0%,52% { opacity:0; } 53%,82% { opacity:.94; } 83%,100% { opacity:0; } }

  /* mouse, telefono y speaker arrastrables */
  #el-mouse, #el-telefono, #el-speaker { cursor:grab; touch-action:none; z-index:10; }
  #el-mouse.dragging, #el-telefono.dragging, #el-speaker.dragging { cursor:grabbing; z-index:50; }

  /* guacamaya en la ventana */
  #el-guacamaya { cursor:pointer; z-index:9; }
  #el-guacamaya.playing img { animation:guacamayaBob .55s infinite ease-in-out; transform-origin:50% 90%; }
  @keyframes guacamayaBob {
    0%, 100% { transform:rotate(0deg) translateY(0); }
    50%      { transform:rotate(-4deg) translateY(-3%); }
  }



  .xp-overlay {
    position:fixed; inset:0; z-index:90; display:none;
    background:rgba(5,7,10,.72); backdrop-filter:blur(3px);
    align-items:center; justify-content:center;
  }
  .xp-overlay.open { display:flex; }
  .xp-window {
    width:min(94vw, 150vh); aspect-ratio:16/9; max-height:92vh;
    background:#000; border:4px solid #2b2f38; border-radius:10px;
    box-shadow:0 30px 80px rgba(0,0,0,.8);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .xp-titlebar {
    flex:0 0 34px; display:flex; align-items:center; gap:10px;
    background:#1a1e26; color:#9fb2c8; padding:0 10px 0 14px;
    font:600 13px ui-monospace, monospace; user-select:none;
  }
  .xp-titlebar .dot { width:10px; height:10px; border-radius:50%; background:#00cfff; }
  .xp-titlebar .name { flex:1; }
  .xp-close {
    background:#3a2126; color:#ff8fa0; border:1px solid #ff4d6d; border-radius:5px;
    font:700 12px ui-monospace, monospace; padding:3px 12px; cursor:pointer;
  }
  .xp-close:hover { background:#55262e; }
  .xp-window iframe { flex:1; width:100%; border:0; display:block; background:#000; }

  #toggle {
    position:fixed; right:14px; bottom:14px; z-index:99;
    font:600 13px ui-monospace, monospace; padding:8px 14px;
    background:#161a20; color:#00ff9d; border:2px solid #00ff9d; border-radius:6px;
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="scene labeled" id="scene">
    <img class="bg" src="assets/bg.png?v=2" alt="room">
    <div class="el region" id="bg-poster" data-name="poster" title="click!"
         style="left:5.625%; top:10.926%; width:17.708%; height:28.426%;"
         onclick="togglePosterNotif()">
      <span class="tag">bg: poster</span>
    </div>
    <div class="el region" id="bg-bed" data-name="bed"
         style="left:0.000%; top:41.204%; width:28.385%; height:43.519%;">
      <span class="tag">bg: bed</span>
    </div>
    <div class="el region" id="bg-desk" data-name="desk"
         style="left:7.812%; top:67.593%; width:80.208%; height:31.481%;">
      <span class="tag">bg: desk</span>
    </div>
    <div class="el region" id="bg-chair" data-name="chair"
         style="left:75.260%; top:73.611%; width:24.740%; height:26.389%;">
      <span class="tag">bg: chair</span>
    </div>
    <div class="el region" id="bg-nightstand" data-name="nightstand"
         style="left:79.427%; top:43.056%; width:12.500%; height:33.333%;">
      <span class="tag">bg: nightstand</span>
    </div>
    <div class="el region" id="bg-window" data-name="window"
         style="left:93.229%; top:0.000%; width:6.771%; height:47.222%;">
      <span class="tag">bg: window</span>
    </div>
    <div class="el region" id="bg-plant-hanging" data-name="plant-hanging"
         style="left:78.125%; top:1.389%; width:10.417%; height:27.778%;">
      <span class="tag">bg: plant-hanging</span>
    </div>
    <div class="el region" id="bg-shelf" data-name="shelf"
         style="left:91.146%; top:51.852%; width:8.854%; height:48.148%;">
      <span class="tag">bg: shelf</span>
    </div>

    <div class="el sprite" id="el-monitor" data-name="monitor"
         style="left:31.250%; top:7.407%; width:41.667%;">
      <img src="assets/monitor.png" alt="monitor">
      <span class="tag">monitor</span>
    </div>
    <div class="el pantalla off" id="el-pantalla" data-name="pantalla"
         style="left:36.458%; top:16.667%; width:31.250%; height:40.278%;">
      <iframe src="pantalla-app/index.html" title="pantalla"></iframe>
      <div class="pantalla-click" title="click para expandir" onclick="openXP()"></div>
      <span class="tag">pantalla</span>
    </div>
    <div class="el boton pressed" id="el-boton" data-name="boton" title="power"
         style="left:65.104%; top:60.185%; width:2.604%; height:3.519%;"
         onclick="togglePC()">
      <span class="tag">boton</span>
    </div>
    <div class="el sprite" id="el-keyboard" data-name="keyboard"
         style="left:32.031%; top:73.148%; width:37.500%;"
         onclick="playKeyboard()">
      <img src="assets/keyboard.png" alt="keyboard">
      <span class="tag">keyboard</span>
    </div>
    <div class="el sprite" id="el-mouse" data-name="mouse"
         style="left:69.896%; top:73.148%; width:5.990%;">
      <img src="assets/mouse.png" alt="mouse">
      <span class="tag">mouse</span>
    </div>
    <div class="el sprite" id="el-speaker" data-name="speaker"
         style="left:17.708%; top:55.556%; width:9.062%;"
         onclick="toggleSpeaker()">
      <img src="assets/speaker.png" alt="speaker">
      <span class="tag">speaker</span>
    </div>
    <div class="el sprite" id="el-cat" data-name="cat"
         style="left:4.688%; top:50.000%; width:10.938%;"
         onclick="toggleZzz()">
      <img src="assets/cat.png" alt="cat">
      <span class="tag">cat</span>
    </div>
    <div class="el sprite" id="el-lamp" data-name="lamp"
         style="left:81.771%; top:26.389%; width:5.469%;"
         onclick="toggleLamp()">
      <img src="assets/lamp.png" alt="lamp">
      <span class="tag">lamp</span>
    </div>
    <div class="xp-notif" id="posterNotif">
      <div class="xp-notif-title">
        <span>💬 nuevo mensaje</span>
        <button onclick="hidePosterNotif(event)">✕</button>
      </div>
      <div class="xp-notif-body">
        want to talk? whatsapp me and let's discuss your next project<br>
        <b>+1 (646) 423-2594</b>
      </div>
    </div>
    <div class="lamp-glow" id="lampGlow"></div>
    <div class="zzz" id="el-zzz"><img src="assets/zzz.png" alt="zzz"></div>
    <!-- luces parpadeantes de la ciudad -->
    <div class="city-light tw"    style="left:95.21%; top:31.76%; --d:2.6s; --dl:.3s"></div>
    <div class="city-light tw"    style="left:97.71%; top:31.76%; --d:3.8s; --dl:1.4s"></div>
    <div class="city-light off"   style="left:96.36%; top:32.10%; --d:7.5s; --dl:2.2s"></div>
    <div class="city-light tw"    style="left:98.86%; top:32.10%; --d:2.2s; --dl:.9s"></div>
    <div class="city-light tw"    style="left:95.23%; top:35.46%; --d:4.4s; --dl:1.8s"></div>
    <div class="city-light off"   style="left:96.38%; top:35.37%; --d:9.0s; --dl:.6s"></div>
    <div class="city-light tw"    style="left:97.73%; top:35.46%; --d:3.1s; --dl:2.7s"></div>
    <div class="city-light tw"    style="left:98.88%; top:35.51%; --d:2.9s; --dl:.2s"></div>
    <div class="city-light off"   style="left:96.38%; top:38.84%; --d:6.4s; --dl:3.1s"></div>
    <div class="city-light tw"    style="left:98.88%; top:38.84%; --d:3.6s; --dl:1.1s"></div>
    <div class="city-light tw"    style="left:95.21%; top:38.84%; --d:2.4s; --dl:2.0s"></div>
    <div class="city-light off"   style="left:97.71%; top:38.84%; --d:8.2s; --dl:1.5s"></div>
    <div class="el sprite" id="el-telefono" data-name="telefono" title="arrastrar"
         style="left:76.100%; top:62.400%; width:7.200%;">
      <img src="assets/telefono.png" alt="telefono">
      <span class="tag">telefono</span>
    </div>
    <div class="el sprite" id="el-guacamaya" data-name="guacamaya" title="guacamaya"
         style="left:89.600%; top:38.300%; width:6.800%;"
         onclick="toggleGuacamaya()">
      <img src="assets/guacamaya.png" alt="guacamaya">
      <span class="tag">guacamaya</span>
    </div>
  </div>
  <button id="toggle" onclick="toggleLabels()">labels: ON</button>

  <div class="xp-overlay" id="xpOverlay" onclick="if(event.target===this)closeXP()">
    <div class="xp-window">
      <div class="xp-titlebar">
        <span class="dot"></span>
        <span class="name">pantalla — xp-desktop-explorer</span>
        <button class="xp-close" onclick="closeXP()">cerrar ✕</button>
      </div>
      <iframe id="xpFrame" title="xp-desktop-explorer" src="about:blank"></iframe>
    </div>
  </div>

<script>
  function openXP() {
    const f = document.getElementById('xpFrame');
    if (!f.dataset.loaded) { f.src = 'pantalla-app/index.html'; f.dataset.loaded = '1'; }
    document.getElementById('xpOverlay').classList.add('open');
  }
  function closeXP() { document.getElementById('xpOverlay').classList.remove('open'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeXP(); });

  function toggleLabels() {
    const s = document.getElementById('scene');
    s.classList.toggle('labeled');
    document.getElementById('toggle').textContent =
      'labels: ' + (s.classList.contains('labeled') ? 'ON' : 'OFF');
  }
  document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'l') toggleLabels(); });

  /* ---------- sonidos ---------- */
  const sndKeyboard = new Audio('assets/sfx-keyboard.mp3');
  const sndSpeaker  = new Audio('assets/gasolina.mp3');
  sndSpeaker.loop = true;
  const sndShutdown = new Audio('pantalla-app/sounds/xp-shutdown.mp3');
  const sndStartup  = new Audio('pantalla-app/sounds/xp-startup.mp3');

  function playKeyboard() {
    sndKeyboard.currentTime = 0;
    sndKeyboard.play().catch(() => {});
  }

  /* ---------- speaker: musica on/off ---------- */
  function toggleSpeaker() {
    const sp = document.getElementById('el-speaker');
    if (sp.dataset.dragged === '1') { sp.dataset.dragged = ''; return; }
    if (sndSpeaker.paused) {
      sndSpeaker.play().then(() => sp.classList.add('playing')).catch(() => {});
    } else {
      sndSpeaker.pause();
      sndSpeaker.currentTime = 0;
      sp.classList.remove('playing');
    }
  }

  /* ---------- lampara on/off ---------- */
  function toggleLamp() {
    document.getElementById('el-lamp').classList.toggle('on');
    document.getElementById('scene').classList.toggle('lamp-on');
  }

  /* ---------- boton power: apaga/enciende la pantalla ---------- */
  function togglePC() {
    const p = document.getElementById('el-pantalla');
    const b = document.getElementById('el-boton');
    const off = p.classList.toggle('off');
    b.classList.toggle('pressed', off);
    if (off) { closeXP(); sndShutdown.currentTime = 0; sndShutdown.play().catch(() => {}); }
    else     { sndStartup.currentTime = 0;  sndStartup.play().catch(() => {}); }
  }

  /* ---------- gato: zzz ---------- */
  function toggleZzz() { document.getElementById('el-zzz').classList.toggle('show'); }

  /* ---------- poster: notificacion whatsapp ---------- */
  const sndDing = new Audio('pantalla-app/sounds/xp-ding.mp3');
  let notifTimer = null;
  function togglePosterNotif() {
    const n = document.getElementById('posterNotif');
    const show = !n.classList.contains('show');
    n.classList.toggle('show', show);
    clearTimeout(notifTimer);
    if (show) {
      sndDing.currentTime = 0; sndDing.play().catch(() => {});
      notifTimer = setTimeout(() => n.classList.remove('show'), 12000);
    }
  }
  function hidePosterNotif(e) {
    e.stopPropagation();
    clearTimeout(notifTimer);
    document.getElementById('posterNotif').classList.remove('show');
  }

  /* ---------- guacamaya: canta (siempre desde el segundo 2) ---------- */
  const sndGuacamaya = new Audio('assets/guacamaya.mp3');
  sndGuacamaya.addEventListener('ended', () =>
    document.getElementById('el-guacamaya').classList.remove('playing'));
  function toggleGuacamaya() {
    const g = document.getElementById('el-guacamaya');
    if (sndGuacamaya.paused) {
      sndGuacamaya.currentTime = 2;
      sndGuacamaya.play().then(() => g.classList.add('playing')).catch(() => {});
    } else {
      sndGuacamaya.pause();
      sndGuacamaya.currentTime = 2;
      g.classList.remove('playing');
    }
  }

  /* ---------- elementos arrastrables (mouse, telefono) ---------- */
  (function () {
    const scene = document.getElementById('scene');
    ['el-mouse', 'el-telefono', 'el-speaker'].forEach(id => {
      const el = document.getElementById(id);
      let drag = null;
      el.addEventListener('pointerdown', e => {
        e.preventDefault();
        el.dataset.dragged = '';
        const r = scene.getBoundingClientRect();
        const m = el.getBoundingClientRect();
        drag = { dx: e.clientX - m.left, dy: e.clientY - m.top, rect: r,
                 w: m.width / r.width * 100, h: m.height / r.height * 100,
                 x0: e.clientX, y0: e.clientY };
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', e => {
        if (!drag) return;
        if (Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) > 6)
          el.dataset.dragged = '1';
        let x = (e.clientX - drag.rect.left - drag.dx) / drag.rect.width * 100;
        let y = (e.clientY - drag.rect.top - drag.dy) / drag.rect.height * 100;
        x = Math.max(0, Math.min(100 - drag.w, x));
        y = Math.max(0, Math.min(100 - drag.h, y));
        el.style.left = x + '%';
        el.style.top = y + '%';
      });
      const end = () => { drag = null; el.classList.remove('dragging'); };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    });
  })();
</script>
</body>
</html>
